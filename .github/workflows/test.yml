name: Tests

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: ruff check src tests
      - name: Run tests with a temporary PostgreSQL database
        run: |
          pg_bin=$(pg_config --bindir)
          socket_dir=$(mktemp -d /tmp/catering-test.XXXXXXXX)
          "$pg_bin/initdb" -D "$RUNNER_TEMP/pgdata" --no-locale -E UTF8 -A trust
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-k $socket_dir -c listen_addresses=''" -l "$RUNNER_TEMP/postgres.log" -w start
          CATERING_TEST_DATABASE_URL="postgresql:///postgres?host=$socket_dir" python -m pytest -q
